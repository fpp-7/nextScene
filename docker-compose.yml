# ──────────────────────────────────────────────────
#  NextScene — Docker Compose
# ──────────────────────────────────────────────────

services:

  # ─── PostgreSQL ────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nextscene-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nextscene}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nextscene}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nextscene-redis
    restart: unless-stopped
    # Cache do catálogo e contador do rate limit de login — janela curta e
    # reconstruível a partir do banco, então persistência não compensa o
    # custo. Sem `ports`: só o backend precisa alcançá-lo.
    command: redis-server --save "" --appendonly no
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Recommendation Engine (FastAPI) ──────────
  recommendation-engine:
    build:
      context: ./recommendation-engine
      dockerfile: Dockerfile
    container_name: nextscene-engine
    restart: unless-stopped
    # Sem `ports`: o motor não tem autenticação nenhuma e só precisa ser
    # alcançável pelo backend, pela rede interna do compose. Publicá-lo em
    # 0.0.0.0:8000 deixava qualquer um na rede consultá-lo à vontade.
    # Para depurar localmente: docker compose run --rm -p 8000:8000 recommendation-engine
    expose:
      - "8000"
    environment:
      ENV: development
      WORKERS: ${ENGINE_WORKERS:-2}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Backend (Spring Boot) ────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextscene-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-nextscene}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1800000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:*,http://10.*:*,http://192.168.*:*,exp://*}
      RECOMMENDATION_ENGINE_URL: http://recommendation-engine:8000
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      # service_started, não service_healthy: o backend tem fallback local quando
      # o motor está fora do ar, então não faz sentido travar a subida da API
      # inteira esperando o carregamento dos modelos.
      recommendation-engine:
        condition: service_started

volumes:
  pgdata:
