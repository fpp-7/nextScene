spring:
  application:
    name: nextscene-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nextscene}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:nextscene-dev-secret-key-change-in-production-min-32-chars!!}
    expiration: ${JWT_EXPIRATION:1800000}
  recommendation-engine:
    url: ${RECOMMENDATION_ENGINE_URL:http://localhost:8000}
  tmdb:
    api-key: ${TMDB_API_KEY:033f05568a4e06d3491ac9c699299e65}
    base-url: ${TMDB_BASE_URL:https://api.themoviedb.org/3}
