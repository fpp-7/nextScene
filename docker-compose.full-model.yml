# ──────────────────────────────────────────────────
#  NextScene — Override para o modelo completo (ml-latest)
# ──────────────────────────────────────────────────
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.full-model.yml up -d
#
# Por que é um override, e não o padrão
# -------------------------------------
# Treinar sobre o ml-latest exige baixar 335 MB de dataset e alguns minutos de
# processamento — custo que não faz sentido impor a todo build. Aqui os
# artefatos entram por volume, a partir do que já foi treinado na máquina.
#
# A imagem padrão continua pequena e auto-suficiente: quem clonar o repositório
# sem esses arquivos sobe a pilha com o modelo small, gerado pelo
# scripts/bootstrap.py.
#
# Pré-requisito: ter rodado localmente
#   cd recommendation-engine
#   ENV=production python -m src.train_pipeline --skip-tmdb

services:
  recommendation-engine:
    environment:
      # Faz o config.py apontar para data/raw/ml-latest e data/processed/ml-latest
      ENV: production
      # O SVD e o DataFrame de avaliações passaram a ser carregados sob
      # demanda, então cada worker ocupa ~275 MB em vez dos 11,7 GB de antes.
      WORKERS: 2
    volumes:
      - ./recommendation-engine/models_saved:/app/models_saved:ro
      - ./recommendation-engine/data:/app/data:ro
