# ──────────────────────────────────────────────────
#  NextScene — Override para o modelo completo (ml-latest)
# ──────────────────────────────────────────────────
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.full-model.yml up -d
#
# Por que é um override, e não o padrão
# -------------------------------------
# O modelo treinado sobre o ml-latest completo (32 milhões de avaliações) ocupa
# 2,3 GB: o SVD do scikit-surprise carrega o trainset inteiro dentro do pickle.
# Assar isso na imagem daria ~4 GB e 16 minutos de build, e ainda exigiria
# baixar 335 MB de dataset durante o build.
#
# Aqui os artefatos entram por volume, a partir do que já foi treinado na
# máquina. Isso mantém a imagem padrão pequena e auto-suficiente — quem clonar o
# repositório sem esses arquivos continua conseguindo subir a pilha com o modelo
# small, gerado pelo scripts/bootstrap.py.
#
# Pré-requisito: ter rodado localmente
#   cd recommendation-engine
#   ENV=production python -m src.train_pipeline --skip-tmdb

services:
  recommendation-engine:
    environment:
      # Faz o config.py apontar para data/raw/ml-latest e data/processed/ml-latest
      ENV: production
      # Cada worker carrega ~2,5 GB (modelo + DataFrame de ratings). Com 15 GB
      # disponíveis ao Docker, 1 worker é o ajuste seguro para o modelo completo.
      WORKERS: 1
    volumes:
      - ./recommendation-engine/models_saved:/app/models_saved:ro
      - ./recommendation-engine/data:/app/data:ro
    healthcheck:
      # Carregar 1,2 GB de pickle mais o DataFrame leva bem mais que os 30s do
      # start_period padrão.
      start_period: 180s
